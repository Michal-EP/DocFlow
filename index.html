<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dokumenty</title>

  <!-- PWA & Konfiguracja ekranu głównego (iOS i Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DocFlow">
  <meta name="application-name" content="DocFlow">
  <meta name="theme-color" content="#2563eb">

  <!-- Odwołanie do ikony aplikacji -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f1f5f9;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="camera; microphone; geolocation"></iframe>

  <script>
    const GOOGLE_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbyRnYLzN-7sLcPAC_x7RC5aYf_dkgZfniUbEKrbA9wROkV1rIq2xjWt5UUVhtk-JWU/exec";

    // 1. Stałe ID urządzenia
    let deviceId = localStorage.getItem('docflow_device_id');
    if (!deviceId) {
      deviceId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
      localStorage.setItem('docflow_device_id', deviceId);
    }

    // 2. Odczyt lub zapamiętanie kodu koordynatora (?k=...)
    const currentParams = new URLSearchParams(window.location.search);
    let coordCode = currentParams.get('k');

    if (coordCode) {
      // Jeśli pracownik wszedł z linku z ?k=..., zapisz kod na stałe w pamięci telefonu
      localStorage.setItem('docflow_coord_code', coordCode.trim());
    } else {
      // Jeśli otworzył z ikony na ekranie głównym (gdzie URL nie ma ?k=), pobierz zapisany kod
      coordCode = localStorage.getItem('docflow_coord_code') || '';
    }

    // 3. Zbuduj pełny adres dla ramki Google Apps Script
    const frameParams = new URLSearchParams();
    frameParams.set('devId', deviceId);
    if (coordCode) {
      frameParams.set('k', coordCode);
    }

    const frame = document.getElementById('appFrame');
    const separator = GOOGLE_SCRIPT_EXEC_URL.includes('?') ? '&' : '?';
    frame.src = GOOGLE_SCRIPT_EXEC_URL + separator + frameParams.toString();
  </script>

</body>
</html>
